name: e2e

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload verified runtime candidate
        uses: actions/upload-artifact@v7
        with:
          name: verified-runtime-candidate
          path: |
            .release/met4morfoses-runtime.tar.gz
            .release/met4morfoses-runtime.tar.gz.sha256
            .release/release-candidate.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Upload production browser verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-browser-verification
          path: test-results/results.json
          if-no-files-found: error
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
