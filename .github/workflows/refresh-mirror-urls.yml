name: Refresh mirror URL metadata

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository pull request
        required: true
        type: string
      expected_head:
        description: Exact 40-character PR head SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mirror-url-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository_id == '1156295383' &&
      github.actor == '4444J99' &&
      github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    env:
      TARGET_PR: ${{ inputs.pr_number }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify open PR and exact same-repository head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" > "$RUNNER_TEMP/mirror-pr.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/mirror-pr.json') as stream:
              pr = json.load(stream)
          assert pr['state'] == 'open' and not pr['merged'], 'PR is not open'
          assert str(pr['head']['repo']['id']) == '1156295383', 'Wrong source repository'
          assert pr['head']['sha'] == os.environ['EXPECTED_HEAD'], 'PR head moved'
          assert 'refs/heads/' + pr['head']['ref'] == os.environ['GITHUB_REF'], 'Wrong branch'
          assert pr['base']['ref'] == 'main', 'Unexpected base'
          PY
      - name: Refresh URL fields without changing canonical data or provenance
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { buildMirrorDownloadUrl } from './src/lib/mirror-url.ts';
          const path = 'src/data/mirror-manifest.json';
          const before = JSON.parse(readFileSync(path, 'utf8'));
          assert(Array.isArray(before) && before.length > 0);
          let changed = 0;
          const after = before.map((asset) => {
            assert.equal(typeof asset.relativePath, 'string');
            const downloadUrl = buildMirrorDownloadUrl(asset.relativePath);
            assert.equal(decodeURIComponent(new URL(downloadUrl, 'https://example.invalid').pathname), '/mirror/' + asset.relativePath);
            if (downloadUrl !== asset.downloadUrl) changed++;
            return { ...asset, downloadUrl };
          });
          const withoutUrl = (entries) => entries.map(({ downloadUrl, ...rest }) => rest);
          assert.deepEqual(withoutUrl(after), withoutUrl(before));
          writeFileSync(path, JSON.stringify(after, null, 2) + '\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Updated ${changed} URLs across ${after.length} assets. All other metadata, source paths, checksums, sizes and timestamps are unchanged.\n`);
          NODE
          git diff --check
          changes="$(git diff --name-only)"
          test -z "$changes" || test "$changes" = src/data/mirror-manifest.json
      - name: Commit only the generated manifest without force-pushing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/mirror-manifest.json; then
            echo 'URL metadata already matches the generator.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" --jq '.head.sha')" = "$EXPECTED_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" --jq '.state')" = open
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/mirror-manifest.json
          test "$(git diff --cached --name-only)" = src/data/mirror-manifest.json
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit -m 'fix(archive): synchronize segment-encoded mirror URLs'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin "HEAD:$GITHUB_REF"
          echo "Metadata commit: $(git rev-parse HEAD). Fresh normal CI and browser checks are required; this job does not merge or deploy." >> "$GITHUB_STEP_SUMMARY"
